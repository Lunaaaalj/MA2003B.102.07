name: Claude Code

# Modo interactivo: Claude responde cuando alguien escribe "@claude" en un
# comentario de issue o PR, en una review, o en el cuerpo/titulo de un issue nuevo.
# El job solo se levanta si el texto contiene la mencion, asi que los comentarios
# normales del equipo no consumen minutos de Actions ni tokens.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # para que Claude pueda leer resultados de CI en las PRs
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Ejecutar Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}

            Lee el CLAUDE.md del repo antes de responder: define las
            convenciones del equipo y manda sobre cualquier costumbre
            general.

            Responde en espanol a lo que se te pidio en el comentario,
            issue o review que te menciono.

            Si te piden revisar codigo o una PR, enfocate en:

            - **Correccion del analisis**: manejo de nulos, valores fuera de
              los rangos fisicos del SIMA, zonas horarias (las marcas de
              tiempo son hora local sin zona; en R se declara tzone "UTC",
              no se convierte), y el hecho de que cada hoja de los Excel es
              una estacion.
            - **Convenciones del repo**: commits en espanol con Conventional
              Commits, nada de rebase ni push directo a main, los analisis
              van en .qmd (no .ipynb) y el .qmd no lleva resultados, el
              texto del reporte va en secciones/ y nunca directo en
              main.tex, las entradas nuevas de references.bib van al final.
            - **Alcance**: que la PR haga lo que dice su issue, ni mas ni
              menos. Escribir de mas en el reporte pisa el trabajo de otra
              persona.
            - Bugs reales y casos borde en el codigo Python/R.

            Se breve y concreto. Usa comentarios inline para problemas
            puntuales de codigo y un comentario general para el resumen. Si
            todo esta bien, dilo en una linea en vez de inventar
            observaciones.

          # Limite de turnos: evita corridas largas accidentales que quemen
          # la cuota de la suscripcion ligada al token.
          claude_args: |
            --max-turns 30
